# Copy to .github/workflows/security.yml in an app repo.
name: Security

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  security:
    uses: tinyhustlers/workflows/.github/workflows/security.yml@main
    with:
      # Release PRs (title "<App> vX.Y.Z: ...") must bump the version one semver step.
      require-release: ${{ contains(github.event.pull_request.title, ' v0.') || contains(github.event.pull_request.title, ' v1.') || contains(github.event.pull_request.title, ' v2.') }}
